name: opencode-review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

jobs:
  opencode-review:
    if: github.event.pull_request.user.login == 'bgzo' && !github.event.pull_request.draft
    runs-on: ubuntu-latest
    # 两次尝试（最长 16 + 11 分钟）加上初始化开销都控制在这里；正常一次 2-10 分钟完成
    timeout-minutes: 30
    # 同一 PR 连续推送时，取消旧的审查，避免重复评论与配额浪费
    concurrency:
      group: opencode-review-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    permissions:
      # 只读 contents：即使工作区变脏，opencode 也无法 push
      contents: read
      # 只有评论需要写权限
      pull-requests: write
      issues: write
    env:
      OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      MODEL: opencode-go/glm-5.3-flash
      # 思考等级：glm-5.3-flash 支持 low/high/max
      VARIANT: high
      # 用 workflow 的 GITHUB_TOKEN（contents: read），不再用 OpenCode App token：
      # App token 有写权限，能绕开下面的 bash deny 规则直接 commit/push
      USE_GITHUB_TOKEN: "true"
      PROMPT: |
        Review this PR. Focus on issues, not on evaluating the PR itself.

        Find correctness, regression, security, robustness, maintainability, and test issues. Also suggest meaningful improvements.

        P0/P1 = blocking.
        P2 = non-blocking TODO.

        Review the current HEAD independently.
        Do not treat previous reviews as authoritative.
        Do not report speculative or purely stylistic concerns.

        Do not run git commit or git push under any circumstances. Review only; never create commits or push. Never create, edit or delete repository files, and never comment on or modify remote branches or history. Never ask the user questions or request confirmation; there is no one to answer in CI, so produce the final review directly.

        Every comment must include: file path + line number, what the issue is, why it is an issue, and a concrete fix suggestion. If a specific line cannot be identified, describe the location.

        BLOCK if P0/P1 exists.
        LGTM otherwise.
        Reply in Simplified Chinese.

        Your final reply is posted verbatim as the PR comment, so it must BE the complete review (verdict plus any P0/P1/P2 items). Finish with a line exactly like `结论：LGTM` or `结论：BLOCK`. Never end with a plan/status note such as "正准备汇总…", and never end on a tool call.
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      # 配置写到全局目录（~/.config/opencode/opencode.json），不要写进仓库目录：
      # opencode 结束时会对「变脏的工作区」执行 git add/commit/push，写进仓库会把自己提交上去
      - name: Configure opencode CI permissions (deny rm / git commit / git push)
        run: |
          mkdir -p "$HOME/.config/opencode"
          cat > "$HOME/.config/opencode/opencode.json" <<'EOF'
          {
            "$schema": "https://opencode.ai/config.json",
            "permission": {
              "bash": {
                "*": "allow",
                "rm *": "deny",
                "rmdir *": "deny",
                "shred *": "deny",
                "truncate *": "deny",
                "git commit": "deny",
                "git commit *": "deny",
                "git * commit*": "deny",
                "*git commit*": "deny",
                "git push": "deny",
                "git push *": "deny",
                "git * push*": "deny",
                "*git push*": "deny"
              },
              "read": "allow",
              "edit": "deny",
              "glob": "allow",
              "grep": "allow",
              "list": "allow",
              "task": "allow",
              "external_directory": "allow",
              "todowrite": "allow",
              "question": "deny",
              "webfetch": "allow",
              "websearch": "allow",
              "lsp": "allow",
              "doom_loop": "allow",
              "skill": "allow"
            }
          }
          EOF
      # 说明：下面内联了 anomalyco/opencode/github 的 composite 步骤
      # （v1.18.33 / 51ef4be1d3c122f18fefb510dca8d778571f4f18）。原 action 的
      # 「Get opencode version」步骤用未认证 curl 请求 GitHub API，共享 runner 上
      # 容易触发限流（60 次/小时）并让整步直接失败，而 action 没有对应 input 可用。
      # 内联后：版本查询带 GITHUB_TOKEN（认证额度 5000 次/小时），失败时回退
      # "latest" 而不是中断 job；其余步骤与 action 行为一致。
      - name: Get opencode version (authenticated, non-fatal)
        id: version
        run: |
          VERSION=$(curl -sf -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            https://api.github.com/repos/anomalyco/opencode/releases/latest \
            | grep -o '"tag_name": *"[^"]*"' | cut -d'"' -f4 || true)
          echo "version=${VERSION:-latest}" >> "$GITHUB_OUTPUT"
      - name: Cache opencode
        id: cache
        uses: actions/cache@v4
        with:
          path: ~/.opencode/bin
          key: opencode-${{ runner.os }}-${{ runner.arch }}-${{ steps.version.outputs.version }}
      - name: Install opencode
        if: steps.cache.outputs.cache-hit != 'true'
        run: curl -fsSL https://opencode.ai/install | bash
      - name: Add opencode to PATH
        run: echo "$HOME/.opencode/bin" >> "$GITHUB_PATH"
      # provider 卡死/网络抖动时最多损失一次尝试的时长，失败后自动进入第二次。
      # 第一次成功（或失败但已产出结论）则跳过第二次。
      - name: Run opencode review (attempt 1)
        id: review_attempt_1
        continue-on-error: true
        timeout-minutes: 16
        run: opencode github run
      - name: Reset workspace before the retry
        if: steps.review_attempt_1.outcome == 'failure'
        run: |
          git reset --hard HEAD
          git clean -fd
      - name: Run opencode review (attempt 2)
        id: review_attempt_2
        if: steps.review_attempt_1.outcome == 'failure'
        continue-on-error: true
        timeout-minutes: 11
        run: opencode github run
      - name: Fail when both review attempts failed
        if: steps.review_attempt_1.outcome == 'failure' && steps.review_attempt_2.outcome == 'failure'
        run: |
          echo "opencode review failed after two attempts" >&2
          exit 1
